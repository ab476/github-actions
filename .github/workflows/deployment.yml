name: Deployment Workflow
on: push
jobs:
    test-job:
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
      
    deploy-job:
        needs: test-job
        runs-on: ubuntu-latest
        steps:
            - name: Get Code
              uses: actions/checkout@v7
            - name: Install dependencies
              run: npm ci
            - name: Build Project
              run: npm run build
            - name: Deploy to Production
              run: echo "Deploying to production server..." # Replace with actual deployment command